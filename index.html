<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Thivisha | A Love Story</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ff758c;
  --rose:#ff4d6d;
  --gold:#d4af37;
}

*{box-sizing:border-box}

body,html{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  font-family:'Quicksand',sans-serif;
  overflow:hidden;
}

/* ===== CINEMATIC BACKGROUND ===== */
.bg-container{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at center,#fff0f3 0%,#ffcbd5 60%,#1a0005 100%);
  animation:fadeIn 3s forwards;
  z-index:1;
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.vignette{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,transparent 60%,rgba(0,0,0,.4));
  z-index:2;
  pointer-events:none;
}

/* ===== CONTENT ===== */
.loader-content{
  text-align:center;
  z-index:5;
  position:relative;
}

.names{
  font-family:'Dancing Script',cursive;
  font-size:3.8rem;
  background:linear-gradient(90deg,#d02a50,#ff758c,#d02a50);
  background-size:200%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite;
}

@keyframes shine{to{background-position:200%}}

.subtitle{
  margin-top:8px;
  font-weight:700;
  letter-spacing:6px;
  font-size:.85rem;
  color:var(--rose);
  opacity:0;
  animation:slideUp 1.5s forwards .8s;
}

@keyframes slideUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* ===== HEART CORE ===== */
.heart-wrapper{
  position:relative;
  margin:50px 0 30px;
  perspective:600px;
}

.floating-heart{
  font-size:5.2rem;
  color:var(--rose);
  animation:heartbeat 1.3s infinite;
  filter:drop-shadow(0 20px 40px rgba(255,77,109,.6));
  position:relative;
  z-index:3;
}

@keyframes heartbeat{
  0%{transform:scale(1)}
  20%{transform:scale(1.25)}
  40%{transform:scale(1)}
  60%{transform:scale(1.15)}
  100%{transform:scale(1)}
}

/* ===== HEART RIPPLE ===== */
.ripple{
  position:absolute;
  top:50%;
  left:50%;
  width:120px;
  height:120px;
  border-radius:50%;
  border:2px solid rgba(255,77,109,.6);
  transform:translate(-50%,-50%);
  animation:ripple 1.3s infinite;
}

@keyframes ripple{
  from{transform:translate(-50%,-50%) scale(.6);opacity:.6}
  to{transform:translate(-50%,-50%) scale(2);opacity:0}
}

/* ===== PROGRESS ===== */
.progress-container{
  width:320px;
  padding:6px;
  background:rgba(255,255,255,.25);
  border-radius:30px;
  backdrop-filter:blur(8px);
}

.progress-bar{
  height:8px;
  background:rgba(255,255,255,.2);
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--rose),var(--pink));
  box-shadow:0 0 20px var(--pink);
  animation:load 4.5s forwards;
}

@keyframes load{to{width:100%}}

#loading-text{
  margin-top:20px;
  font-size:.8rem;
  letter-spacing:1px;
  font-weight:600;
  color:#5a0012;
}

/* ===== BOKEH ===== */
.bokeh{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.8),transparent 70%);
  pointer-events:none;
  animation:bokehFloat linear infinite;
}

@keyframes bokehFloat{
  from{transform:translateY(110vh) scale(.4);opacity:0}
  20%{opacity:.4}
  80%{opacity:.4}
  to{transform:translateY(-20vh) scale(1.4);opacity:0}
}
</style>
</head>

<body>

<div class="bg-container" id="bg"></div>
<div class="vignette"></div>

<div class="loader-content">
  <div class="names">From Danaselan to Thivisha</div>
  <div class="subtitle">A Journey Worth Living</div>

  <div class="heart-wrapper">
    <div class="ripple"></div>
    <i class="fas fa-heart floating-heart"></i>
  </div>

  <div class="progress-container">
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <p id="loading-text">Preparing our world...</p>
</div>

<script>
/* Loading phrases */
const phrases=[
  "Gathering the stars...",
  "Reviving sweet memories...",
  "Polishing the diamonds...",
  "Preparing my heart...",
  "Ready for you..."
];

let i=0;
setInterval(()=>{
  if(i<phrases.length){
    const t=document.getElementById("loading-text");
    t.style.opacity=0;
    setTimeout(()=>{
      t.innerText=phrases[i++];
      t.style.opacity=1;
    },400);
  }
},900);

/* Bokeh generator */
const bg=document.getElementById("bg");
setInterval(()=>{
  const b=document.createElement("div");
  b.className="bokeh";
  const size=Math.random()*80+30;
  b.style.width=b.style.height=size+"px";
  b.style.left=Math.random()*100+"vw";
  const dur=Math.random()*10+12;
  b.style.animationDuration=dur+"s";
  bg.appendChild(b);
  setTimeout(()=>b.remove(),dur*1000);
},500);

/* Transition */
setTimeout(()=>{
  document.body.style.transition="opacity 1.2s ease";
  document.body.style.opacity="0";
  setTimeout(()=>{
    window.location.href="dashboard.html";
  },1200);
},5200);
</script>

</body>
</html>
